function extract(tx){const L=tx.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),em=new Set(),out=[],seen=new Set();
L.forEach((l,i)=>{if(/important|frequently asked|expected|repeated|high weight|more marks/i.test(l))[i-1,i,i+1].forEach(k=>em.add(k))});
const add=(t,i)=>{t=t.replace(/^[\d.)\-•*●▪\s]+/,'').replace(/[:;,.\s]+$/,'').trim();const k=t.toLowerCase();if(t.length<3||t.length>60||seen.has(k)||/^(page|copyright|www|http|name|date|roll|reg)/i.test(t)||!/[a-z]/i.test(t))return;seen.add(k);out.push({t,i})};
L.forEach((l,i)=>{const m=l.match(/^(?:module|unit|chapter|topic|lesson)\s*[\dIVXivx.]+\s*[:.\-–—)]?\s*(.*)$/i);
if(m&&m[1]){const p=m[1].split(/[,;]/);p.length>2&&m[1].length>50?p.forEach(x=>add(x,i)):add(m[1],i);return}
if(/^\d+(\.\d+)*[.)]\s+\S/.test(l)&&l.length<70)return add(l,i);
if(/^[-•*●▪]\s+\S/.test(l)&&l.length<70)return add(l,i);
if(l.length>40&&/:/.test(l)&&l.split(/[,;]/).length>=3)return l.split(':').slice(1).join(':').split(/[,;]/).forEach(x=>add(x,i));
if(l.length<50&&l.split(' ').length<=7&&/^[A-Z0-9]/.test(l)&&!/[.!?]$/.test(l)&&!/^\d+$/.test(l))add(l,i)});

else if(a=='start'){const x=S.plan.items[+d.i];x.d=0;PT={i:+d.i,total:x.m*60,left:x.m*60,run:1};if(x.b){render();toast('Break started')}else{SB=topicOf(x.n);SS='lesson';ST='lesson';go('study');toast('Timer started. Study the material below.');sg2('lesson')}}
else if(a=='watch'){const r=RS.find(z=>z[0]==+d.id)||RS[1];SB=r[4];SS='lesson';ST='lesson';go('study');sg2('lesson')}
else if(a=='sample'){DOC={name:'Sample: 8086 notes',sample:1,text:NB[1].join('\n'),topics:[{t:'Data transfer',w:3},{t:'Arithmetic',w:3},{t:'Logical',w:2},{t:'Branching',w:2},{t:'Flags',w:1}]};S.doc={...DOC};buildSY();save();go('dash');toast('Sample material added')}
else if(a=='toLvl'){stLoad();ST='lvl';G.topic=G.topic||(DOC.topics[0]&&DOC.topics[0].t)||'';G.txt=DOC.text;go('studio')}
else if(a=='sess'){SB=d.v||(DOC&&DOC.topics[0]&&DOC.topics[0].t)||'';SS='doc';go('study')}
else if(a=='sess2'){$('#dg').close();const r=RS.find(z=>z[0]==+d.id)||RS[0];SB=r[4];SS='doc';go('study')}
else if(a=='sstab'){SS=d.v;if(d.v!='doc')ST=d.v;render()}
else if(a=='sg2')sg2(SS)
else if(a=='sbt'){SB=DOC.topics[+d.i].t;render()}
else if(a=='odoc')odoc()
else if(a=='vid')mkvideo()
else if(a=='agr')agrade()
else if(a=='pp'){PT.run=!PT.run;render()}
else if(a=='rst'){PT.left=PT.total;PT.run=0;render()}
else if(a=='stop'){PT=null;render()}
else if(a=='edit'){edit=!edit;render()}
else if(a=='rs'){const t=el.value.split(':');if(t.length==2){S.plan.s=+t[0]*60+ +t[1];save();render();toast('Schedule shifted')}}
else if(a=='dur'){const i=+d.i;S.plan.items[i].m=+el.value;if(PT&&PT.i==i)PT=null;save();render()}
else if(a=='mv'){const i=+d.i,j=i+ +d.d,I=S.plan.items;if(j>=0&&j<I.length){[I[i],I[j]]=[I[j],I[i]];if(PT){if(PT.i==i)PT.i=j;else if(PT.i==j)PT.i=i}save();render()}}
else if(a=='del'){const i=+d.i;S.plan.items.splice(i,1);if(PT){if(PT.i==i)PT=null;else if(PT.i>i)PT.i--}save();render()}
else if(a=='add'){const n=$('#an').value.trim()||'Study block';S.plan.items.push({n,m:+$('#am').value,b:/break/i.test(n)});save();render();toast('Block added')}
else if(a=='docplan'){const ch=DOC.topics.filter((o,i)=>$('#dt'+i).checked);if(!ch.length)return toast('Select at least one topic');const T=+$('#dv').value,t=($('#ds').value||'18:00').split(':'),rv=Math.max(10,Math.round(T*.1/5)*5),pr=Math.round(T*.15/5)*5,br=T>=90?10:0,tot=ch.reduce((x,o)=>x+o.w,0),sd=T-rv-pr-br;
const it=[...ch].sort((a,b)=>b.w-a.w).map(o=>({n:'Study: '+o.t,m:Math.max(5,Math.round(sd*o.w/tot/5)*5)}));if(br)it.splice(Math.ceil(it.length/2),0,{n:'Break',m:10,b:1});it.push({n:'Practice questions',m:pr},{n:'Quick Revision',m:rv});{const d=T-it.reduce((a,x)=>a+x.m,0),k=it.reduce((m,x,i)=>x.m>it[m].m?i:m,0);it[k].m=Math.max(5,it[k].m+d)}PT=null;S.plan={title:$('#de').value+' · '+DOC.name,s:+t[0]*60+ +t[1],items:it};save();go('plan');toast('Study plan generated from your document')}

else if(a=='next'){Q.i++<Q.n-1?render():(Q.i--,finishQ())}
else if(a=='again'){Q=null;render()}
else if(a=='recov'){S.plan=mkRec();PT=null;save();Q=null;go('plan');toast('Recovery plan generated for your weak areas')}
else if(a=='sp'){S.u={...S.u,n:$('#pn').value||'Student',c:$('#pc').value,v:$('#pv2').value,s:$('#ps').value};save();toast('Profile saved')}
else if(a=='sprf'){S.pf={lv:$('#pl').value,types:$('#prt').value,n:$('#pnn').checked?1:0,e:$('#pne').checked?1:0};save();toast('Preferences saved')}

else if(a=='login')doLogin();
else if(a=='signup')doSignup();
else if(a=='qsim'){let m=null;try{m=localStorage.getItem('learnliftt.last')}catch(x){}m&&accts()[m]?enter(m):toast('No account on this device yet. Sign up first.')}
else if(a=='logout'){save();S=fresh();DOC=null;buildSY();K=null;try{localStorage.removeItem(SE)}catch(x){}am='in';PT=null;Q=null;render()}
else if(a=='psy'){S.u.y=$('#py').value;save();toast('College system saved')}
else if(a=='pdf')mkpdf(ST);
else if(a=='rep'){const f={lesson:()=>G.lesson.slides[LP.i].heading,puz:()=>(G.puz.flashcards[FC.i]||{}).q,map:()=>G.map.center,lvl:()=>G.lvl.levels[LV.i].q}[ST],it=String(f&&f()||'').slice(0,120);(S.reps=S.reps||[]).push({tab:ST,item:it,at:Date.now()});save();toast('Flagged for review. Thank you.');stShow()}
else if(a=='stab'){stSave();ST=d.v;render()}

else if(a=='mt'){MG.sel=+d.i;stShow()}
else if(a=='md'){if(MG.sel==null)return toast('Pick a term first');if(+d.i===MG.sel){MG.done.push(MG.sel);MG.sel=null;toast(MG.done.length==G.puz.match.length?'Puzzle solved! 🎉':'Correct ✓')}else toast('Not a match. Try again');stShow()}
else if(a=='fc'){const n=(G.puz.flashcards||[]).length||1;if(d.v=='flip')FC.f=!FC.f;else{FC.i=(FC.i+1)%n;FC.f=0}stShow()}

else if(a=='lr'){delete LV.fb[LV.i];delete LV.msg[LV.i];stShow()}
else if(a=='lm'){const q=G.lvl.levels[LV.i];LV.ans[LV.i]=($('#la')||{}).value||'';LV.msg[LV.i]='<div class="c" style="background:var(--pl)"><b>Model answer</b><p style="margin:6px 0 0">'+e(q.model||'')+'</p></div>';LV.ok[LV.i]=1;stShow()}
else if(a=='lg')lgrade()
else if(a=='ln'){LV.i++;stShow()}
else if(a=='reset'){try{localStorage.removeItem(K)}catch(x){}{const u=S.u,au=S.auth;S=fresh();S.u=u;S.auth=au;DOC=null;buildSY();save()}Q=null;go('dash');toast('Demo data reset')}
else if(a=='menu')$('#sd').classList.toggle('open');
else if(a=='help')toast('Tip: start on the dashboard and tap Find My Study Path')}
